<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title><style>
:root{color-scheme:light dark;--bg:#f6f5f8;--fg:#1d1a22;--dim:#5d5868;--card:#ffffff;--line:#e3e0e8;--link:#5b3fd6}
@media (prefers-color-scheme:dark){:root{--bg:#141118;--fg:#efeaf5;--dim:#a9a2b6;--card:#1e1a24;--line:#2e2836;--link:#b7a4ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px}h1{font-size:28px;margin:0 0 4px}p.lead{color:var(--dim);margin:0 0 28px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}li a{display:block;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--fg);text-decoration:none}
li a strong{display:block;color:var(--link)}li a span{color:var(--dim);font-size:14px}footer{margin-top:32px;color:var(--dim);font-size:14px}a{color:var(--link)}
</style></head><body><main>
